<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arya</title>
<style>
  :root{ --ink:#e8eaf0; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:ui-monospace,'Cascadia Code',monospace}
  html,body{height:100%}
  body{background:#05060f;color:var(--ink);overflow:hidden}

  #solo{height:100%;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 35%, #131a39 0%, #0b1024 45%, #05060f 100%)}
  .soloInner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;padding:18px;gap:2.4vh}

  .spaceBg{position:absolute;inset:0;z-index:0;overflow:hidden}
  .stars{position:absolute;inset:0;background-repeat:repeat}
  .s1{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#fff,transparent),radial-gradient(1px 1px at 200px 50px,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 300px 120px,#fff,transparent),radial-gradient(1px 1px at 80px 160px,#fff,transparent);background-size:340px 200px;animation:tw 4s ease-in-out infinite}
  .s2{background-image:radial-gradient(1px 1px at 60px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 180px 140px,#cfe0ff,transparent),radial-gradient(1px 1px at 260px 30px,#fff,transparent),radial-gradient(1px 1px at 340px 100px,#fff,transparent);background-size:400px 240px;animation:tw 5.5s ease-in-out infinite;animation-delay:.8s;opacity:.75}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:.85}}

  /* ===== CANLI ARYA (video) ===== */
  .videoWrap{width:min(86vw,62vh);height:min(86vw,62vh);border-radius:28px;overflow:hidden;position:relative;
    background:#05060f;box-shadow:0 14px 50px rgba(0,0,0,.55);
    transition:box-shadow .35s ease, transform .35s ease}
  .videoWrap video{width:100%;height:100%;object-fit:cover;display:block}
  .videoWrap.listen{box-shadow:0 0 0 4px rgba(120,230,170,.55), 0 0 60px rgba(120,230,170,.6), 0 14px 50px rgba(0,0,0,.55);transform:scale(1.02)}
  .videoWrap.talk{box-shadow:0 0 0 4px rgba(255,200,120,.55), 0 0 56px rgba(255,200,120,.55), 0 14px 50px rgba(0,0,0,.55)}

  #aryaSays{font-size:clamp(17px,2.7vw,24px);color:#fff;max-width:84%;text-align:center;line-height:1.5;min-height:1.4em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};

  // videoyu garantiye al (bazı tarayıcılarda autoplay tetiklemek gerekir)
  try{ var v=$('aryaVid'); if(v){ v.muted=true; var p=v.play(); if(p&&p.catch) p.catch(function(){}); } }catch(e){}

  function makeCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var s='';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
  function remember(k,v){ try{localStorage.setItem(k,v);}catch(e){} try{document.cookie=k+'='+encodeURIComponent(v)+';path=/;max-age=31536000';}catch(e){} }
  function recall(k){ try{var val=localStorage.getItem(k);if(val)return val;}catch(e){} try{var m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)');if(m)return decodeURIComponent(m[2]);}catch(e){} return null; }

  var familyCode = recall('tvdesk_tv_code') || recall('arya_solo_code') || makeCode();
  remember('arya_solo_code', familyCode);

  var familyMemory='';
  var brainHistory=[];

  function loadMemory(){
    fetch('/.netlify/functions/mem-get?code='+encodeURIComponent(familyCode))
      .then(function(r){return r.json();})
      .then(function(d){ familyMemory=(d&&d.text)?d.text:''; })
      .catch(function(){});
  }
  function saveMemory(items){
    if(!items||!items.length) return;
    familyMemory=(familyMemory?familyMemory+'\n':'')+items.join('\n');
    fetch('/.netlify/functions/mem-save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:familyCode,items:items})}).catch(function(){});
  }

  function aryaSpeak(text){
    if(!text) return;
    try{ var s=$('aryaSays'); if(s) s.textContent=text; }catch(e){}
    try{ var w=$('faceWrap'); if(w){ w.classList.add('talk'); } }catch(e){}
    try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }catch(e){}
  }

  function askBrain(q){
    var h=brainHistory.slice(-4).join(' | ');
    var url='/.netlify/functions/brain?q='+encodeURIComponent(q)
          +'&h='+encodeURIComponent(h)
          +'&mem='+encodeURIComponent(familyMemory.slice(-1500));
    fetch(url)
      .then(function(r){return r.json();})
      .then(function(d){
        brainHistory.push('Kullanici: '+q);
        if(d && Array.isArray(d.learn) && d.learn.length) saveMemory(d.learn);
        var ans=(d&&d.text)?d.text:'Bunu tam anlayamadim, tekrar soyler misin?';
        brainHistory.push('Arya: '+ans);
        if(brainHistory.length>8) brainHistory=brainHistory.slice(-8);
        aryaSpeak(ans);
      })
      .catch(function(){ aryaSpeak('Su an cevap veremedim, az sonra tekrar dene.'); });
  }

  window._aryaHear=function(text){
    text=(text||'').trim();
    if(text.length<2) return;
    try{ var s=$('aryaSays'); if(s) s.textContent='…'; }catch(e){}
    askBrain(text);
  };

  loadMemory();
})();
</script>
