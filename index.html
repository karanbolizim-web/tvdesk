<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arya</title>
<style>
  :root{ --ink:#e8eaf0; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:ui-monospace,'Cascadia Code',monospace}
  html,body{height:100%}
  body{background:#05060f;color:var(--ink);overflow:hidden}

  #solo{height:100%;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, #1a2348 0%, #0d1228 45%, #05060f 100%)}
  .soloInner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;padding:20px}
  #solo::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 52%, rgba(5,6,15,.12), rgba(5,6,15,.5));pointer-events:none}

  .spaceBg{position:absolute;inset:0;z-index:0;overflow:hidden}
  .stars{position:absolute;inset:0;background-repeat:repeat}
  .s1{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#fff,transparent),radial-gradient(1px 1px at 200px 50px,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 300px 120px,#fff,transparent),radial-gradient(1px 1px at 80px 160px,#fff,transparent);background-size:340px 200px;animation:tw 4s ease-in-out infinite}
  .s2{background-image:radial-gradient(1px 1px at 60px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 180px 140px,#cfe0ff,transparent),radial-gradient(1px 1px at 260px 30px,#fff,transparent),radial-gradient(1px 1px at 340px 100px,#fff,transparent);background-size:400px 240px;animation:tw 5.5s ease-in-out infinite;animation-delay:.8s;opacity:.8}
  .s3{background-image:radial-gradient(1px 1px at 40px 110px,#fff,transparent),radial-gradient(1px 1px at 150px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 280px 170px,#fff,transparent);background-size:300px 220px;animation:tw 7s ease-in-out infinite;animation-delay:.4s;opacity:.6}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:.9}}
  .planet{position:absolute;top:8%;right:9%;width:min(13vh,110px);height:min(13vh,110px);border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fdf6e3 0%, #e9dcc0 55%, #cdbf9a 100%);
    box-shadow:0 0 40px rgba(245,235,200,.5), inset -10px -8px 20px rgba(120,110,85,.5)}
  .planet::after{content:"";position:absolute;top:30%;left:25%;width:18%;height:18%;border-radius:50%;background:rgba(150,140,110,.35);box-shadow:14px 22px 0 -3px rgba(150,140,110,.3), 30px 6px 0 -5px rgba(150,140,110,.25)}

  /* ===== ARYA (fotograf + canli tepkiler) ===== */
  #aryaFace{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;margin-top:1vh;user-select:none}
  .faceWrap{width:min(40vh,300px);height:min(40vh,300px);border-radius:50%;overflow:hidden;position:relative;
    background:#0d1228;box-shadow:0 10px 40px rgba(0,0,0,.45);
    animation:breathe 4s ease-in-out infinite;
    transition:transform .35s ease, box-shadow .35s ease}
  .faceWrap img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .faceWrap.listen{box-shadow:0 0 0 4px rgba(120,230,170,.55), 0 0 55px rgba(120,230,170,.6), 0 10px 40px rgba(0,0,0,.45);transform:scale(1.05);animation:none}
  .faceWrap.talk{box-shadow:0 0 0 4px rgba(255,200,120,.55), 0 0 52px rgba(255,200,120,.55), 0 10px 40px rgba(0,0,0,.45);animation:talkpulse .7s ease-in-out infinite}
  @keyframes talkpulse{0%,100%{transform:scale(1.0)}50%{transform:scale(1.05)}}
  .faceWrap.happy{animation:hop .5s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

  #aryaName{font-size:clamp(24px,4vw,38px);font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6);margin-top:.5vh}
  #aryaSays{font-size:clamp(17px,2.6vw,24px);color:#fff;max-width:82%;text-align:center;line-height:1.5;min-height:1.4em;text-shadow:0 2px 8px rgba(0,0,0,.7);margin-top:.4vh}
</style>
</head>

      <div id="aryaName">Arya</div>
      <div id="aryaSays">Bir saniye…</div>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};

  function makeCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var s='';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
  function remember(k,v){ try{localStorage.setItem(k,v);}catch(e){} try{document.cookie=k+'='+encodeURIComponent(v)+';path=/;max-age=31536000';}catch(e){} }
  function recall(k){ try{var v=localStorage.getItem(k);if(v)return v;}catch(e){} try{var m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)');if(m)return decodeURIComponent(m[2]);}catch(e){} return null; }

  var familyCode = recall('tvdesk_tv_code') || recall('arya_solo_code') || makeCode();
  remember('arya_solo_code', familyCode);

  var familyMemory='';
  var brainHistory=[];

  function loadMemory(){
    fetch('/.netlify/functions/mem-get?code='+encodeURIComponent(familyCode))
      .then(function(r){return r.json();})
      .then(function(d){ familyMemory=(d&&d.text)?d.text:''; })
      .catch(function(){});
  }
  function saveMemory(items){
    if(!items||!items.length) return;
    familyMemory=(familyMemory?familyMemory+'\n':'')+items.join('\n');
    fetch('/.netlify/functions/mem-save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:familyCode,items:items})}).catch(function(){});
  }

  function aryaSpeak(text){
    if(!text) return;
    try{ var s=$('aryaSays'); if(s) s.textContent=text; }catch(e){}
    try{ var w=$('faceWrap'); if(w){ w.classList.add('talk'); } }catch(e){}
    try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }catch(e){}
  }

  function askBrain(q){
    var h=brainHistory.slice(-4).join(' | ');
    var url='/.netlify/functions/brain?q='+encodeURIComponent(q)
          +'&h='+encodeURIComponent(h)
          +'&mem='+encodeURIComponent(familyMemory.slice(-1500));
    fetch(url)
      .then(function(r){return r.json();})
      .then(function(d){
        brainHistory.push('Kullanici: '+q);
        if(d && Array.isArray(d.learn) && d.learn.length) saveMemory(d.learn);
        var ans=(d&&d.text)?d.text:'Bunu tam anlayamadim, tekrar soyler misin?';
        brainHistory.push('Arya: '+ans);
        if(brainHistory.length>8) brainHistory=brainHistory.slice(-8);
        aryaSpeak(ans);
      })
      .catch(function(){ aryaSpeak('Su an cevap veremedim, az sonra tekrar dene.'); });
  }

  window._aryaHear=function(text){
    text=(text||'').trim();
    if(text.length<2) return;
    try{ var s=$('aryaSays'); if(s) s.textContent='…'; }catch(e){}
    askBrain(text);
  };

  loadMemory();
})();
</script>
